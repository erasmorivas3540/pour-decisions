name: Temporary Phase 6 full validation
on:
  push:
    branches: [phase6-validation-runner]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase6-final-pass
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install developer tools
        run: npm ci
      - name: Format final documentation
        run: npx prettier --write README.md TEST_REPORT.md docs/ENGINEERING_NOTES.md docs/LOAD_TEST.md
      - name: Check repository-wide formatting
        run: npx prettier --check .
      - name: Run complete syntax and regression suite
        run: npm run check
      - name: Commit validated documentation to staging branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md TEST_REPORT.md docs/ENGINEERING_NOTES.md docs/LOAD_TEST.md
          if ! git diff --cached --quiet; then
            git commit -m "Temporary Phase 6 documentation formatting"
            git push origin HEAD:phase6-final-pass
          fi
