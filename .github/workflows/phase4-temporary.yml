name: Temporary Phase 4 formatting and verification
on:
  push:
    branches: [phase4-format-runner]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4-spill-replays
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Format touched sources
        run: npx prettier --write game.js public/app.js public/style.css tests/replay.test.js tests/camera-views.test.js docs/ENGINEERING_NOTES.md
      - name: Check formatting
        run: npx prettier --check .
      - name: Run regression suite
        run: npm run check
      - name: Push validated formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js public/app.js public/style.css tests/replay.test.js tests/camera-views.test.js docs/ENGINEERING_NOTES.md
          if ! git diff --cached --quiet; then
            git commit -m "Temporary validated Phase 4 formatting"
            git push origin HEAD:phase4-spill-replays
          fi
