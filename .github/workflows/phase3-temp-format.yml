name: Temporary Phase 3 formatter
on:
  push:
    branches: [phase3-ci-validation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply Prettier to all supported repository files
        run: npx prettier --write .
      - name: Save formatted files for inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Temporary: format sources for Phase 3 review"
            git push origin HEAD:phase3-ci-validation
          fi
      - name: Run regression checks
        run: npm run check
